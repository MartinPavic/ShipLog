name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Plain Postgres is enough: the database-backed tests run against it.
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/app_test
      DATABASE_URL_UNPOOLED: postgres://postgres@localhost:5432/app_test
      # Dummy values: nothing here talks to a real service.
      NEXT_PUBLIC_APP_URL: https://example.com
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_dummy
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_PRICE_ID: price_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      CRON_SECRET: ci-dummy-secret-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Environment check
        run: npm run setup -- --check --production --db

      - name: Migrate
        run: npm run db:migrate

      - name: Type check
        run: npm run typecheck

      # Includes the rule that forbids explicit `any`.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Licenses
        run: npm run licenses -- --check
